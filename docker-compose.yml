version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentforge_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentforge_frontend
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
